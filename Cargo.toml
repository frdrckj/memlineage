[workspace]
resolver = "2"
members = [
    "crates/memlineage-core",
    "crates/memlineage-cli",
    "crates/memlineage-mcp-proxy",
    "python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/frdrckj/memlineage"
homepage = "https://github.com/frdrckj/memlineage"
keywords = ["agents", "memory", "security", "provenance", "llm"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
