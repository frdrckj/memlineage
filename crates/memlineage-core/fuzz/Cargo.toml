[package]
name = "memlineage-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
memlineage-core = { path = ".." }

[[bin]]
name = "policy_parse"
path = "fuzz_targets/policy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_check"
path = "fuzz_targets/policy_check.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# Own workspace so the main build does not compile libfuzzer.
[workspace]
