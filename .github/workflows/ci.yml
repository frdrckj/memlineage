name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: attack suite
        run: |
          cargo run -q -p memlineage-cli -- attack run --suite core --store mem0 --scenarios attacks/scenarios
          cargo run -q -p memlineage-cli -- attack run --suite core --store langgraph --scenarios attacks/scenarios
          cargo run -q -p memlineage-cli -- attack run --suite core --store mcp-memory --scenarios attacks/scenarios

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: install tools
        run: python -m pip install maturin pytest ruff mypy pyyaml types-PyYAML langgraph "langgraph-checkpoint-postgres>=3.1.3" "psycopg[binary]" mem0ai==2.2.1
      - name: build
        working-directory: python
        run: maturin develop
      - name: ruff
        working-directory: python
        run: ruff check . && ruff format --check .
      - name: mypy
        working-directory: python
        run: mypy --strict memlineage tests pack_cli.py
      - name: command
        run: cargo build -p memlineage-py --bin memlineage
      - name: pytest
        working-directory: python
        env:
          OPENAI_API_KEY: sk-dummy
        run: pytest
