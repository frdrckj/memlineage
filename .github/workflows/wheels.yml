name: wheels

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_args: --release --bindings bin --out dist-bin -i /opt/python/cp310-cp310/bin/python
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_args: --release --bindings bin --out dist-bin -i python3.10
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_args: --release --bindings bin --out dist-bin
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_args: --release --bindings bin --out dist-bin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_args: --release --bindings bin --out dist-bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
          manylinux: auto
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.bin_args }}
          before-script-linux: ${{ matrix.before }}
          working-directory: python
          manylinux: auto
      - name: pack the command into the wheel
        shell: bash
        run: |
          if command -v sudo >/dev/null; then
            sudo chmod -R a+rwX python/dist python/dist-bin
          else
            chmod -R a+rwX python/dist python/dist-bin
          fi
          py=python3
          command -v python3 >/dev/null || py=python
          "$py" python/pack_cli.py python/dist/*.whl python/dist-bin/*.whl
