[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "memlineage"
version = "0.1.0"
description = "Provenance and taint checks for agent memory."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Frederick Jerusha" }]
readme = "README.md"
keywords = ["agents", "memory", "security", "provenance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/frdrckj/memlineage"
Repository = "https://github.com/frdrckj/memlineage"
Issues = "https://github.com/frdrckj/memlineage/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "pyyaml>=6", "types-PyYAML>=6"]

[tool.maturin]
module-name = "memlineage._core"
python-source = "."
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["memlineage"]

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
